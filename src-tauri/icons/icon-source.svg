<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" version="1.1" aria-labelledby="title desc">
  <title id="title">MD Reader</title>
  <desc id="desc">Editable vector reconstruction: blue rounded app tile, open white book with exactly two pages on each side, pale blue circuits on the upper left page, and a blue bookmark on the upper right page. All artwork is native SVG; no embedded raster images or external assets.</desc>
  <defs>
    <linearGradient id="tile-blue" x1="627" y1="58" x2="627" y2="1166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ad0f8"/>
      <stop offset=".26" stop-color="#209aff"/>
      <stop offset=".57" stop-color="#0879ff"/>
      <stop offset="1" stop-color="#0050f4"/>
    </linearGradient>
    <radialGradient id="tile-top-light" cx="616" cy="28" r="804" gradientTransform="translate(0 10) scale(1 .69)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2ffef" stop-opacity=".57"/>
      <stop offset=".63" stop-color="#65d9ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5fd0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile-bottom-light" cx="622" cy="988" r="470" gradientTransform="translate(0 346) scale(1 .65)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3fbaff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#1689ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left-under" x1="183" y1="590" x2="619" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9fcff"/>
      <stop offset=".2" stop-color="#d6e3f6"/>
      <stop offset=".57" stop-color="#bad0ef"/>
      <stop offset="1" stop-color="#86b2ed"/>
    </linearGradient>
    <linearGradient id="right-under" x1="636" y1="670" x2="1076" y2="589" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86b2ed"/>
      <stop offset=".43" stop-color="#bad0ef"/>
      <stop offset=".8" stop-color="#d8e5f7"/>
      <stop offset="1" stop-color="#f8fcff"/>
    </linearGradient>
    <linearGradient id="left-paper" x1="292" y1="436" x2="671" y2="727" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".46" stop-color="#f9faff"/>
      <stop offset=".79" stop-color="#edf2fb"/>
      <stop offset="1" stop-color="#d0e0f6"/>
    </linearGradient>
    <linearGradient id="right-paper" x1="697" y1="727" x2="956" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e5edfa"/>
      <stop offset=".48" stop-color="#f7f9fe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="spine-shade" x1="614" y1="0" x2="638" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91b8e8" stop-opacity="0"/>
      <stop offset=".46" stop-color="#7ea9df" stop-opacity=".25"/>
      <stop offset=".59" stop-color="#a0c5ee" stop-opacity=".21"/>
      <stop offset="1" stop-color="#f6faff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="circuit-blue" x1="272" y1="450" x2="574" y2="633" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5dfff"/>
      <stop offset=".55" stop-color="#88c3ff"/>
      <stop offset="1" stop-color="#65b6ff"/>
    </linearGradient>
    <linearGradient id="node-blue" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#65c4ff"/>
      <stop offset="1" stop-color="#3198ff"/>
    </linearGradient>
    <linearGradient id="bookmark-blue" x1="866" y1="290" x2="909" y2="479" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69c8ff"/>
      <stop offset=".37" stop-color="#209dff"/>
      <stop offset=".78" stop-color="#0878ff"/>
      <stop offset="1" stop-color="#0060f5"/>
    </linearGradient>
    <linearGradient id="bookmark-edge" x1="855" y1="294" x2="910" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b0e4ff" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#3aafff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0050e5" stop-opacity=".9"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="book-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="23"/>
    </filter>
    <filter id="page-shadow" x="-30%" y="-20%" width="165%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="bookmark-shadow" x="-60%" y="-30%" width="230%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="left-page-clip">
      <path d="M627 410 C574 333 448 286 322 287 C291 287 273 301 270 332 L236 785 C233 813 251 830 278 828 C422 820 552 844 615 938 Q627 954 627 937 Z"/>
    </clipPath>
  </defs>

