    <ellipse id="bottom-glow" cx="627" cy="979" rx="483" ry="185" fill="url(#tile-bottom-light)"/>
    <path id="tile-rim" d="M348 58 H908 C1001 58 1065 82 1114 131 C1168 184 1195 250 1195 348 V878 C1195 978 1172 1047 1119 1100 C1068 1147 1007 1166 917 1166 H338 C245 1166 179 1145 129 1095 C78 1044 62 975 62 885 V347 C62 250 88 184 141 132 C193 81 258 58 348 58Z" fill="none" stroke="#b7edff" stroke-opacity=".38" stroke-width="1.5"/>
  </g>

  <g id="book-cast-shadow" data-name="Book shadow" fill="#00399f" opacity=".48" filter="url(#book-shadow)">
