    <path id="left-paper-edge" d="M270 332 C273 301 291 287 322 287 C448 286 574 333 627 410 M236 785 C233 813 251 830 278 828 C422 820 552 844 615 938" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="2.2"/>
    <path id="right-paper-edge" d="M627 410 C690 334 810 290 929 288 C963 286 982 301 985 332 M1019 785 C1022 813 1004 830 977 828 C834 820 703 844 639 938" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="2.2"/>
    <path id="center-fold" d="M613 392 Q621 400 627 410 Q633 402 641 394 L641 934 Q627 958 613 934Z" fill="url(#spine-shade)"/>
  </g>

  <g id="left-page-circuits" data-name="Left page circuits" clip-path="url(#left-page-clip)" fill="none" stroke="url(#circuit-blue)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
