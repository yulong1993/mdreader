[package]
name = "mdreader"
version = "0.1.0"
description = "A lightweight GitHub-style Markdown reader for Windows"
authors = ["gongs"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary for a name conflict with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "mdreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：内嵌 dist 资源而非连接 devUrl。`tauri build` 会自动带上；
# 直接用 cargo 构建时必须 `--features custom-protocol`，否则产出连 localhost:1420 的开发版二进制。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify-debouncer-full = "0.5"
notify = "8"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
