<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>MD Reader</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        align-items: flex-start;
        padding: 2px 0 0 2px;
      }
      /* 跟手"浮动标签"：与标签栏里的 tab 同款观感（标题 + ×），略抬高 + 投影 */
      #pill {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        box-sizing: border-box;
        padding: 0 8px 0 12px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #d0d7de;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
        font: 12.5px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
        white-space: nowrap;
      }
      #pill-title {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #gx {
        flex: none;
        color: #656d76;
        font-size: 14px;
        line-height: 1;
        padding: 0 3px;
      }
      @media (prefers-color-scheme: dark) {
        #pill {
          background: #252a31;
          border-color: #3d444d;
          color: #e6e8ea;
        }
        #gx {
          color: #8b949e;
        }
      }
    </style>
  </head>
  <body>
    <div id="pill"><span id="pill-title"></span><span id="gx">×</span></div>
    <script type="module" src="/src/ghost.js"></script>
  </body>
</html>
