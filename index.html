<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Reader</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-open" class="tb-btn" title="打开文件 / 最近文档 / 从文件夹打开 (Ctrl+O)">📂 打开 ▾</button>
        <span id="file-name" title="">未打开文件</span>
        <span class="tb-spacer"></span>
        <button id="btn-pdf" class="tb-btn" title="导出 PDF / 打印 (Ctrl+P)">🖨 PDF</button>
        <button id="btn-edit" class="tb-btn" title="编辑 (Ctrl+E)，Ctrl+S 保存">✏️ 编辑</button>
        <button id="btn-outline" class="tb-btn icon" title="显示/隐藏大纲 (Ctrl+\)">☰</button>
        <button id="btn-theme" class="tb-btn icon" title="切换主题：自动 / 浅色 / 深色">◐</button>
      </header>
      <div id="tabbar" hidden>
        <div id="tabs" role="tablist" aria-label="打开的文档"></div>
      </div>
      <div id="main">
        <nav id="outline" aria-label="文档大纲"></nav>
        <div id="content-wrap">
          <div id="preview-pane">
            <div id="welcome">
              <div class="card">
                <div class="logo">
                  <svg viewBox="0 0 1024 1024" width="88" height="88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MD Reader">
                    <defs>
                      <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#7DD0F8"/>
                        <stop offset="1" stop-color="#2E9FEE"/>
                      </linearGradient>
                      <linearGradient id="wpage" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#FFFFFF"/>
                        <stop offset="1" stop-color="#EDF6FE"/>
                      </linearGradient>
                    </defs>
                    <rect width="1024" height="1024" rx="230" fill="url(#wbg)"/>
                    <g transform="translate(512,552) scale(1.26) translate(-512,-552)">
                      <path d="M512 400 C 420 352, 300 344, 190 362 L 190 676 C 300 658, 420 666, 512 714 C 604 666, 724 658, 834 676 L 834 362 C 724 344, 604 352, 512 400 Z" fill="#2795DB"/>
                      <path d="M512 388 C 428 344, 316 336, 214 352 L 214 656 C 316 640, 428 648, 512 692 Z" fill="url(#wpage)"/>
                      <path d="M512 388 C 596 344, 708 336, 810 352 L 810 656 C 708 640, 596 648, 512 692 Z" fill="url(#wpage)"/>
                      <rect x="506" y="388" width="12" height="304" rx="6" fill="#BCDDF5" opacity="0.85"/>
                      <text x="512" y="606" font-family="Segoe UI, sans-serif" font-size="188" font-weight="800" fill="#0C7BC0" text-anchor="middle" letter-spacing="8">MD</text>
                    </g>
                  </svg>
                </div>
                <h1>MD Reader</h1>
                <p>把 Markdown 文件拖进窗口，或按 <kbd>Ctrl</kbd>+<kbd>O</kbd> 打开</p>
                <ul class="features">
                  <li>GitHub 风格渲染：表格、任务列表、代码高亮、Emoji</li>
                  <li>多标签页：文件不再互相顶掉，可拖出成新窗口 · 重启恢复</li>
                  <li>数学公式 <code>$...$</code> 与 Mermaid 图表</li>
                  <li>文件保存后自动刷新 · 大纲导航 · 亮 / 暗主题</li>
                  <li>双击任意段落直接编辑（改完点空白处退出），<code>Ctrl+S</code> 保存</li>
                </ul>
              </div>
            </div>
            <article id="content" class="markdown-body" hidden></article>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <div id="modal-overlay" hidden>
      <div id="close-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <div class="dlg-icon">⚠️</div>
        <h2 id="dlg-title">有未保存的修改</h2>
        <p id="dlg-text"></p>
        <div class="dlg-buttons">
          <button id="dlg-save-exit" class="primary">保存并退出</button>
          <button id="dlg-exit">直接退出</button>
          <button id="dlg-cancel">取消</button>
        </div>
      </div>
    </div>
    <div id="folder-overlay" hidden>
      <div id="folder-dialog" role="dialog" aria-modal="true" aria-label="文件夹中的文档">
        <h2 id="folder-title">选择文档</h2>
        <div class="fd-path" id="folder-path"></div>
        <div id="folder-list"></div>
      </div>
    </div>
  </body>
</html>
